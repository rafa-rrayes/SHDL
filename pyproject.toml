[project]
name = "shdlc"
version = "0.1.0"
description = "SHDL to Base SHDL flattener: the front-end of the SHDL toolchain"
requires-python = ">=3.14"
dependencies = []

[project.scripts]
shdlc = "shdlc.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["shdlc"]

[dependency-groups]
dev = ["pytest>=8"]

[tool.pytest.ini_options]
testpaths = ["tests"]
