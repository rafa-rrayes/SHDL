[project]
name = "PySHDL"
version = "1.0.0"
description = "SHDL hardware-description toolchain: the PySHDL user-facing driver, the SHDL→Base SHDL flattener, the Base SHDL→C compiler (shdlc), and the conformance suite."
readme = "README.md"
requires-python = ">=3.14"
license = "GPL-3.0-or-later"
license-files = ["LICENSE"]
authors = [{ name = "rafa-rrayes", email = "rafa@rayes.com.br" }]
dependencies = []

[project.urls]
Homepage = "https://github.com/rafa-rrayes/SHDL"
Repository = "https://github.com/rafa-rrayes/SHDL"
Documentation = "https://rafa-rrayes.github.io/SHDL/"

[project.scripts]
shdl-flatten = "flattener.cli:main"
shdlc = "shdlc.cli:main"
shdl-conformance = "conformance.runner.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["pyshdl", "flattener", "shdlc", "conformance", "SHDL"]

[dependency-groups]
dev = ["pytest>=8", "ruff>=0.6"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
# Matches the existing code's convention (flattener max line 99, shdlc 97).
line-length = 100
# target-version is inferred from requires-python (>=3.14).

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B"]
ignore = [
    # The formatter owns line wrapping; E501 would only flag long Base-SHDL
    # string literals (golden netlist text) intentionally kept on one line.
    "E501",
    # zip()-without-strict is pure style here: every flagged site zips
    # structurally equal-length sequences. A blanket strict=False would just
    # restate the default; auditing for strict=True risks a behavior change.
    "B905",
]

[tool.ruff.lint.per-file-ignores]
# Standalone benchmark/profiling scripts bootstrap sys.path before importing the
# toolchain (so imports cannot come first, E402) and use throwaway timing /
# assembler closures that capture loop variables for immediate use (B023).
"examples/**" = ["E402", "B023"]
# flattener/ line numbers are a pinned contract: tests/flattener/
# test_diagnostic_sites.py (DIA-2/DIA-8) registers the exact (line, col) of
# every `raise err(...)` site. The only two rules whose autofixes currently
# fire here both shift lines (import sorting, deprecated-import rewrites), so
# they are off for this tree. All other lint stays on; the formatter is
# excluded below for the same reason.
"flattener/**" = ["I001", "UP035"]

[tool.ruff.format]
# See the flattener per-file-ignores note: reformatting shifts the raise-site
# line numbers pinned by test_diagnostic_sites.py.
exclude = ["flattener/**"]
